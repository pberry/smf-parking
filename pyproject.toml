[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smf-parking"
version = "1.0.0"
description = "Hourly poller and plotter for Sacramento International Airport (SMF) parking availability."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Pat Berry", email = "pberry@gmail.com" }]
license = { text = "0BSD" }
dependencies = [
    "playwright>=1.40",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smf-poll = "smf_parking.poll:main"
smf-plot = "smf_parking.plot:main"

[tool.setuptools.packages.find]
include = ["smf_parking*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
